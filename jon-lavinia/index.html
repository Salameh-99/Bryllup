  .gate-door.left img{ left:0; }
  .gate-door.right img{ right:0; }
  .cover.opening .gate-door.left{ transform:rotateY(-78deg); }
  .cover.opening .gate-door.right{ transform:rotateY(78deg); }

  .gate-post{ position:absolute; top:0; bottom:0; width:10px; z-index:4; pointer-events:none;

  .gate-post.right{ right:0; }

  .gate-vines .vr{ right:-2%; bottom:8%; transform:scaleX(-1); transform-origin:bottom right; animation-delay:1.1s; }

  @keyframes roseBloom{

  .nav{ position:fixed; bottom:0; inset-inline:0; z-index:55; height:calc(58px + env(safe-area-inset-bottom));
    padding-bottom:env(safe-area-inset-bottom); display:flex; align-items:center; justify-content:space-around;
    background:rgba(243,238,228,.94); border-top:1px solid rgba(95,111,78,.14); backdrop-filter:blur(14px);
    transition:transform .5s ease, opacity .45s ease; }
  .nav a,.nav button{ background:none; border:none; cursor:pointer; color:var(--moss-deep);
    display:flex; flex-direction:column; align-items:center; gap:2px; font-family:var(--body); font-size:.55rem; opacity:.65; flex:1;
    transition:opacity .2s, color .2s; text-decoration:none; }
  .nav a:hover,.nav button:hover{ opacity:1; color:var(--moss); }
  .nav a.active{ opacity:1; color:var(--moss); }
  .nav svg{ width:19px; height:19px; }
  .nav .center{ flex:none; width:48px; height:48px; margin-top:-16px; border-radius:50%;
    background:var(--cream); color:var(--moss); border:1px solid rgba(95,111,78,.2);
    box-shadow:0 4px 12px rgba(95,111,78,.16); opacity:1; }
  .nav .center.muted{ opacity:.35; cursor:default; box-shadow:none; }
  .nav .center svg{ width:22px; height:22px; }
  .nav .center span{ display:none; }

  .reveal{ opacity:0; transform:translateY(24px); transition:opacity .75s cubic-bezier(.2,.8,.2,1), transform .75s cubic-bezier(.2,.8,.2,1); }
  .reveal.in{ opacity:1; transform:none; }
  .reveal.in .s-flourish img{ animation:flourishIn .8s ease .2s both; }
  @keyframes flourishIn{ from{ opacity:0; transform:scale(.85)} to{ opacity:.85; transform:none} }
  .s-flourish img{ opacity:0; }
  .reveal.in .s-flourish img, .reveal.in .s-script{ opacity:1; }
  body:not(.invitation-open) .reveal{ opacity:0; transform:translateY(20px); }

  @media (max-width:720px){
    .gate-cta{ width:76px; height:76px; }
    .gate-cta .initials{ font-size:1.35rem; }
    .hero-content{ top:37%; width:min(80vw,270px); }
    #roseLeft{ left:0; bottom:16%; width:42%; max-width:150px; }
    #roseRight{ right:-1%; bottom:14%; width:44%; max-width:156px; }
    .scroll-cue{ bottom:calc(13.5% + 56px); }
    .program-panel{ padding:1.65rem 1rem 1.45rem; }
    .program-bg{ width:min(340px,112%); max-height:220px; opacity:.15; }
    .timeline{ max-width:260px; }
    .tl-sprig{ width:52px; }
    .attend-row{ flex-direction:column; }
  }
  @media (prefers-reduced-motion:reduce){
    .scroll-cue,.cover-hint,.gate-cta,.rsvp-open-btn,.fountain-jet,.fountain-drop{ animation:none !important; }
    body.invitation-open .hero-name,body.invitation-open .hero-amp,body.invitation-open .hero-label,
    body.invitation-open .hero-date-short,body.invitation-open .scroll-cue,body.invitation-open #roseLeft,body.invitation-open #roseRight,
    body.invitation-open .fountain{ opacity:1; transform:none; animation:none !important; }
    body.invitation-open #roseRight{ transform:scaleX(-1); }
    body.invitation-open .hero-motion{ opacity:1; transform:none; }
    .reveal,.tl-item{ opacity:1; transform:none; }
    .timeline::before{ transform:translateX(-50%) scaleY(1); }
    .timeline.show .tl-item{ animation:none; opacity:1; transform:none; }
    .petal,.spark,.gate-bloom,.gate-vines img,.hero-blossoms span{ display:none !important; }
    .cover.opening .gate-door.left,.cover.opening .gate-door.right{ transform:none; opacity:0; }
    body.invitation-open #roseLeft,body.invitation-open #roseRight{ opacity:1; animation:none !important; }
    body.invitation-open #roseRight{ transform:scaleX(-1); }
  }
</style>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const DIAMOND = '<svg viewBox="0 0 14 14" fill="currentColor"><path d="M7 1l6 6-6 6-6-6z"/></svg>';
  let lang = localStorage.getItem("wedding-lang") || "no";

  function t(){ return CONFIG.t[lang]; }
  function L(obj){ return (obj && typeof obj === "object" && (obj.no || obj.fa)) ? (obj[lang] || obj.no) : obj; }

  function fmtDateShort(){
    return new Date(CONFIG.date).toLocaleDateString("nb-NO", { day:"2-digit", month:"2-digit", year:"2-digit" }).replace(/\//g, ".");
  }
  function fmtDateLong(){
    const d = new Date(CONFIG.date);
    const locale = lang === "fa" ? "fa-IR" : "nb-NO";
    return d.toLocaleDateString(locale,{weekday:"long",day:"numeric",month:"long",year:"numeric"})
         + " · " + d.toLocaleTimeString("nb-NO",{hour:"2-digit",minute:"2-digit"});
  }
  function fmtTime(time){
    if(!time) return lang === "fa" ? "بعداً" : "Senere";
    const [h,m] = time.split(":");
    return h + ":" + m;
  }

  function calLink(){
    const pad=n=>String(n).padStart(2,"0");
    const fmt=dt=>dt.getFullYear()+pad(dt.getMonth()+1)+pad(dt.getDate())+"T"+pad(dt.getHours())+pad(dt.getMinutes())+"00";
    const s=new Date(CONFIG.date), e=new Date(s.getTime()+CONFIG.durationHours*36e5);
    const p=new URLSearchParams({ action:"TEMPLATE", text:"Bryllup "+CONFIG.nameFirst+" & "+CONFIG.nameSecond, dates:fmt(s)+"/"+fmt(e), location:CONFIG.venue.address });
    return "https://calendar.google.com/calendar/render?"+p.toString();
  }

  function setHeroVideo(src){
    const hv = $("heroVideo"), hm = $("heroMedia");
    if(!src || /\.(jpe?g|png|webp)$/i.test(src)){
      hm.classList.add("no-video");
      document.body.classList.remove("has-hero-video");
      if(src && /\.(jpe?g|png|webp)$/i.test(src)) $("heroImg").src = src;
      return;
    }
    hv.onerror = () => {
      if(CONFIG.heroVideoFallback && src !== CONFIG.heroVideoFallback){
        setHeroVideo(CONFIG.heroVideoFallback);
      } else {
        hm.classList.add("no-video");
        document.body.classList.remove("has-hero-video");
      }
    };
    hv.onloadeddata = () => {
      hm.classList.remove("no-video");
      document.body.classList.add("has-hero-video");
    };
    hv.src = src;
    hv.load();
  }

  function applyMedia(){
    const imgs = CONFIG.images || {};
    if(imgs.gate){
      $("gateImgL").src = imgs.gate;
      $("gateImgR").src = imgs.gate;
    }
    if(imgs.gateGarden) $("gateGarden").src = imgs.gateGarden;
    if(imgs.arch) $("archImg").src = imgs.arch;
    if(imgs.roseLeft){
      $("roseLeft").src = imgs.roseLeft;
      $("gateVineL").src = imgs.roseLeft;
      $("detailRoseL").src = imgs.roseLeft;
    }
    if(imgs.roseRight){
      $("roseRight").src = imgs.roseRight;
      $("gateVineR").src = imgs.roseRight;
      $("detailRoseR").src = imgs.roseRight;
    }
    if(imgs.hero) $("heroImg").src = imgs.hero;
    if(imgs.roseBotanical) $("introRose").src = imgs.roseBotanical;
    if(imgs.mapFrame) $("mapFrameImg").src = imgs.mapFrame;
    if(imgs.programBg) $("programBg").src = imgs.programBg;
    if(imgs.acommDecor) $("programAcomm").src = imgs.acommDecor;
    document.querySelectorAll('[id^="flourish"]').forEach(el => { if(imgs.decorFlourish) el.src = imgs.decorFlourish; });

    setHeroVideo(CONFIG.heroVideo || CONFIG.heroVideoFallback || "");
  }

  function renderGallery(){
    const items = CONFIG.images?.gallery || [];
    $("galleryGrid").innerHTML = items.map((g, i) =>
      `<figure class="${g.tall ? "tall" : ""}" data-g="${i}" hidden>
         <img src="${g.src}" alt="" loading="lazy" style="object-position:${g.pos||"center"}"
              onload="this.closest('figure').hidden=false"
              onerror="this.closest('figure').remove()">
       </figure>`
    ).join("");
  }

  function render(){
    const T = t();
    document.documentElement.lang = lang === "fa" ? "fa" : "no";
    document.documentElement.dir = lang === "fa" ? "rtl" : "ltr";
    document.body.classList.toggle("fa", lang === "fa");
    document.title = L(CONFIG.names);

    $("langBtn").textContent = T.toggle || "";
    $("langBtn").hidden = !T.toggle;
    $("langBtn").style.display = T.toggle ? "" : "none";
    $("coverTap").textContent = T.coverTap;
    $("sealInitials").textContent = CONFIG.initials;

    $("heroLabel").textContent = T.eyebrow || T.weddingDay;
    $("heroDateShort").textContent = fmtDateShort();
    $("heroNames").innerHTML =
      `<span class="hero-name">${CONFIG.nameFirst}</span>`+
      `<span class="hero-amp">&</span>`+
      `<span class="hero-name">${CONFIG.nameSecond}</span>`;
    $("scrollCue").textContent = T.scrollDown;

    $("bismillah").textContent = T.bismillah || "";
    $("bismillah").style.display = T.bismillah ? "" : "none";
    $("tagline").innerHTML = T.tagline.map(l => `<p>${l}</p>`).join("");
    $("letterSalut").textContent = T.letterSalut;
    $("letterBody").textContent = T.letter;
    $("letterSign").textContent = T.letterSign;
    $("letterNames").textContent = L(CONFIG.names);

    $("cdTitle").textContent = T.cdTitle;
    $("programTitle").textContent = T.programTitle;
    buildCountdown();

    const roseImg = CONFIG.images?.roseMarker || "";
    const sprigL = CONFIG.images?.programSprigLeft || "";
    const sprigR = CONFIG.images?.programSprigRight || "";
    $("timeline").innerHTML = CONFIG.program.map((p,i) => {
      let marker = DIAMOND;
      if(p.rose && roseImg){
        marker =
          (sprigL ? `<img class="tl-sprig tl-sprig-l" src="${sprigL}" alt="" aria-hidden="true">` : "")+
          `<img class="tl-rose" src="${roseImg}" alt="">`+
          (sprigR ? `<img class="tl-sprig tl-sprig-r" src="${sprigR}" alt="" aria-hidden="true">` : "");
      }
      const label = L(p);
      return `<li class="tl-item${p.rose ? " rose-event" : ""}" style="--i:${i}"><span class="tl-time">${fmtTime(p.time)}</span>`+
        `<span class="tl-marker">${marker}</span>`+
        `<span class="tl-event">${label}</span></li>`;
    }).join("");

    $("venueTitle").textContent = T.venueTitle;
    $("venueName").textContent = L(CONFIG.venue.name);
    $("venueAddr").textContent = CONFIG.venue.address;
    const q = encodeURIComponent(CONFIG.venue.mapsQuery);
    $("mapFrame").src = `https://www.google.com/maps?q=${q}&output=embed`;
    $("saveBtn").textContent = T.saveDate; $("saveBtn").href = calLink();
    $("dirBtn").textContent = T.directions; $("dirBtn").href = `https://www.google.com/maps/dir/?api=1&destination=${q}`;

    $("galleryTitle").textContent = T.galleryTitle;
    $("gallerySub").textContent = T.gallerySub;
    renderGallery();

    $("dressTitle").textContent = T.dressTitle;
    $("dressBody").textContent = T.dress;
    $("giftTitle").textContent = T.giftTitle;
    $("giftBody").textContent = T.gift;

    $("rsvpTitle").textContent = T.rsvpTitle;
    $("rsvpIntro").textContent = T.rsvpIntro;
    $("rsvpDeadline").textContent = L(CONFIG.rsvpDeadline) || "";
    $("rsvpOpenHint").textContent = T.rsvpOpen;
    $("modalTitle").textContent = T.rsvpTitle;
    $("optYes").textContent = T.yes; $("optNo").textContent = T.noBtn;
    $("lName").textContent = T.fName; $("lGuests").textContent = T.fGuests;
    $("lSong").textContent = T.fSong; $("lChildren").textContent = T.fChildren;
    $("lNotes").textContent = T.fNotes;
    $("sendBtn").textContent = T.send; $("rsvpMsg").textContent = "";

    $("closingLine").textContent = T.closing;
    $("footerNames").textContent = L(CONFIG.fullNames);
    $("footerDate").textContent = fmtDateLong();
    $("footerDesign").innerHTML = `${T.designCredit} <a href="${CONFIG.design.url}" target="_blank" rel="noopener">${CONFIG.design.brand}</a>`;

    document.querySelectorAll('.nav a[data-k] span').forEach(sp => {
      sp.textContent = T.nav[sp.parentElement.dataset.k];
    });

    updateCountdown();
    updateCenterButton();

    if(document.body.classList.contains("invitation-open")){
      $("timeline")?.classList.remove("show");
      observeScrollAnimations();
    }
  }

  let prevCd = [null,null,null,null];
  let cdNums = null;
  function buildCountdown(){
    const T = t();
    $("cdRow").innerHTML = [0,1,2,3].map(i => {
      const unit = `<div class="cd-unit"><div class="cd-num" data-i="${i}">00</div><div class="cd-label">${T.cdUnits[i]}</div></div>`;
      return i < 3 ? unit + `<span class="cd-sep">:</span>` : unit;
    }).join("");
    cdNums = [...document.querySelectorAll(".cd-num")];
    prevCd = [null,null,null,null];
  }
  function updateCountdown(){
    if(!cdNums) buildCountdown();
    const diff = new Date(CONFIG.date) - new Date();
    const vals = [
      Math.max(0, Math.floor(diff/864e5)),
      Math.max(0, Math.floor(diff%864e5/36e5)),
      Math.max(0, Math.floor(diff%36e5/6e4)),
      Math.max(0, Math.floor(diff%6e4/1e3))
    ];
    vals.forEach((v,i) => {
      const el = cdNums[i];
      const txt = String(v).padStart(2,"0");
      if(el.textContent !== txt){
        if(prevCd[i] !== null) el.classList.add("tick");
        el.textContent = txt;
        setTimeout(()=>el.classList.remove("tick"), 360);
      }
      prevCd[i] = v;
    });
  }
  setInterval(updateCountdown, 1000);

  function sendRSVP(){
    const T = t();
    const name = $("rName").value.trim() || "—";
    const guests = $("rGuests").value || "1";
    const song = $("rSong").value.trim() || "—";
    const children = $("rChildren").value.trim() || "—";
    const att = document.querySelector('input[name="attend"]:checked').value;
    const attTxt = att === "yes" ? T.yes : T.noBtn;
    const notes = $("rNotes").value.trim() || "—";
    const body = `${T.fName}: ${name}\n${T.rsvpTitle}: ${attTxt}\n${T.fGuests}: ${guests}\n${T.fSong}: ${song}\n${T.fChildren}: ${children}\n${T.fNotes}: ${notes}`;
    window.location.href = `mailto:${CONFIG.rsvpEmail}?subject=${encodeURIComponent("RSVP — "+name)}&body=${encodeURIComponent(body)}`;
    $("rsvpMsg").textContent = T.thanks;
  }

  $("sendBtn").addEventListener("click", sendRSVP);
  $("rsvpOpenBtn").addEventListener("click", () => { $("rsvpModal").classList.add("open"); $("rsvpModal").setAttribute("aria-hidden","false"); });
  $("modalClose").addEventListener("click", closeModal);
  $("rsvpModal").addEventListener("click", e => { if(e.target === $("rsvpModal")) closeModal(); });
  function closeModal(){ $("rsvpModal").classList.remove("open"); $("rsvpModal").setAttribute("aria-hidden","true"); }

  $("langBtn").addEventListener("click", () => {
    lang = lang === "no" ? "fa" : "no";
    localStorage.setItem("wedding-lang", lang);
    render();
  });

  const audio = $("bgAudio"); let playing = false, userPaused = false;
  if(CONFIG.musicSrc){ audio.src = CONFIG.musicSrc; audio.preload = "auto"; audio.load(); }

  function updateCenterButton(){
    const btn = $("centerBtn"), icon = $("centerIcon"), T = t();
    if(!btn || !icon) return;
    if(!CONFIG.musicSrc){
      btn.classList.add("muted");
      btn.setAttribute("aria-label", T.nav.music);
      return;
    }
    btn.classList.remove("muted");
    const isOn = playing && !userPaused;
    btn.setAttribute("aria-pressed", isOn ? "true" : "false");
    btn.setAttribute("aria-label", isOn ? "Slå av musikken" : "Slå på musikken");
    icon.innerHTML = isOn
      ? '<path d="M9 18V5l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/>'
      : '<path d="M9 18V5l10-2v12"/><circle cx="6" cy="18" r="3"/><circle cx="16" cy="16" r="3"/><path d="M4 4l16 16"/>';
  }
  function setMusicState(on){
    if(!CONFIG.musicSrc) return;
    if(on) audio.play().then(()=>{ playing=true; userPaused=false; updateCenterButton(); }).catch(()=>{});
    else { audio.pause(); playing=false; userPaused=true; updateCenterButton(); }
  }
  $("centerBtn").addEventListener("click", ()=>{
    if(!CONFIG.musicSrc) return;
    if(playing && !userPaused) setMusicState(false); else setMusicState(true);
  });

  let revealIo, programIo;
  function observeScrollAnimations(){
    if(revealIo) revealIo.disconnect();
    if(programIo) programIo.disconnect();

    revealIo = new IntersectionObserver(es => es.forEach(e => {
      if(e.isIntersecting){ e.target.classList.add("in"); revealIo.unobserve(e.target); }
    }), { threshold: .15, rootMargin: "0px 0px -8% 0px" });
    document.querySelectorAll(".reveal").forEach(el => {
      el.classList.remove("in");
      revealIo.observe(el);
    });

    const timeline = $("timeline");
    const programPanel = $("programPanel");
    if(timeline && programPanel){
      timeline.classList.remove("show");
      programIo = new IntersectionObserver(es => es.forEach(e => {
        if(e.isIntersecting){
          timeline.classList.add("show");
          programIo.disconnect();
        }
      }), { threshold:.4, rootMargin: "0px 0px -12% 0px" });
      programIo.observe(programPanel);
    }
  }

  const FLOWER_SVG = `<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <circle cx="12" cy="12" r="3.2" fill="#E8C4A8"/>
    <ellipse cx="12" cy="5.5" rx="3.2" ry="4.2" fill="#D8B8B4"/>
    <ellipse cx="12" cy="18.5" rx="3.2" ry="4.2" fill="#C4A09C"/>
    <ellipse cx="5.5" cy="12" rx="4.2" ry="3.2" fill="#D8B8B4"/>
    <ellipse cx="18.5" cy="12" rx="4.2" ry="3.2" fill="#C4A09C"/>
  </svg>`;

  function spawnSparkles(){
    if(reduceMotion) return;
    const s = $("seal"); if(!s) return;
    const r = s.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
    for(let i=0;i<16;i++){
      const sp = document.createElement("div"); sp.className = "spark";
      const a = Math.random()*Math.PI*2, dist = 60 + Math.random()*120;
      sp.style.left = cx+"px"; sp.style.top = cy+"px";
      sp.style.width = (7+Math.random()*8)+"px";
      sp.style.height = sp.style.width;
      sp.style.setProperty("--dx", (Math.cos(a)*dist).toFixed(0)+"px");
      sp.style.setProperty("--dy", (Math.sin(a)*dist).toFixed(0)+"px");
      document.body.appendChild(sp); setTimeout(()=>sp.remove(),950);
    }
  }
  function spawnPetals(){
    if(reduceMotion) return;
    for(let i=0;i<22;i++){
      const p = document.createElement("div");
      p.className = "petal";
      p.innerHTML = FLOWER_SVG;
      p.style.left = (Math.random()*100)+"vw";
      p.style.width = (12+Math.random()*14)+"px";
      p.style.height = p.style.width;
      p.style.setProperty("--drift", ((Math.random()-.5)*120).toFixed(0)+"px");
      p.style.animationDuration = (5.5+Math.random()*6)+"s";
      p.style.animationDelay = (Math.random()*2.8)+"s";
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 15000);
    }
  }

  const OPEN = { hero:520, petals:680, petals2:1600, hide:1900 };

  let opened = false;
  function openInvitation(){
    if(opened) return; opened = true;
    const cover = $("cover");
    const flash = $("openFlash");

    spawnSparkles();
    if(flash){ flash.classList.add("on"); setTimeout(()=>flash.classList.remove("on"), 1000); }

    cover.classList.add("opening");
    document.body.classList.remove("locked");

    setTimeout(() => {
      document.body.classList.add("invitation-open");
      const hv = $("heroVideo");
      if(hv && hv.src) hv.play().catch(()=>{});
      if(CONFIG.musicSrc) setMusicState(true);
    }, OPEN.hero);

    setTimeout(spawnPetals, OPEN.petals);
    setTimeout(spawnPetals, OPEN.petals2);
    setTimeout(() => {
      cover.classList.add("done");
      cover.style.display = "none";
      observeScrollAnimations();
      initScrollSpy();
    }, OPEN.hide);
  }
  $("cover").addEventListener("click", openInvitation);
  $("seal").addEventListener("click", e => { e.stopPropagation(); openInvitation(); });

  document.querySelectorAll('a[href^="#"]').forEach(a => {
    a.addEventListener("click", e => {
      const el = document.getElementById(a.getAttribute("href").slice(1));
      if(!el) return;
      e.preventDefault();
      el.scrollIntoView({ behavior:"smooth", block:"start" });
    });
  });

  const spySections = ["home","intro","program","place","gallery","rsvp"];
  let spyIo;
  function initScrollSpy(){
    if(spyIo) spyIo.disconnect();
    const links = [...document.querySelectorAll('.nav a[href^="#"]')];
    spyIo = new IntersectionObserver(es => {
      const visible = es.filter(e => e.isIntersecting).sort((a,b) => b.intersectionRatio - a.intersectionRatio);
      if(!visible.length) return;
      const id = visible[0].target.id;
      links.forEach(l => l.classList.toggle("active", l.getAttribute("href") === "#"+id));
    }, { threshold: [.2,.35,.5], rootMargin: "-20% 0px -55% 0px" });
    spySections.forEach(id => {
      const el = document.getElementById(id);
      if(el) spyIo.observe(el);
    });
  }

  function resetToStart(){
    scrollTo(0,0);
    document.body.classList.add("locked");
    document.body.classList.remove("invitation-open");
    opened = false;
    const c = $("cover");
    if(c){ c.style.display=""; c.classList.remove("opening","done"); }
    $("timeline")?.classList.remove("show");
    document.querySelectorAll(".reveal,.tl-item").forEach(el => el.classList.remove("in"));
    closeModal();
    if(location.hash) history.replaceState(null,"",location.pathname+location.search);
  }

  resetToStart();
  addEventListener("pageshow", resetToStart);
  applyMedia();
  render();
})();
</script>
</body>
</html>
